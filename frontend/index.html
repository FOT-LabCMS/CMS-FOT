<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/gif" href="/university_logo.gif" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Apple / iOS meta tags -->
    <!-- apple-mobile-web-app-capable: enables standalone (home-screen) mode   -->
    <!-- apple-mobile-web-app-status-bar-style: keeps the native status bar    -->
    <!-- viewport-fit=cover above: honours safe-area insets on notched iPhones -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Basic SEO -->
    <title>FOTLAB - Faculty of Technology Chemical Management System</title>
    <meta
      name="description"
      content="Faculty of Technology Chemical Management System"
    />

    <!-- Open Graph - Link Preview -->
    <meta property="og:title" content="FOTLAB - Chemical Management System" />
    <meta
      property="og:description"
      content="Faculty of Technology Chemical Management System"
    />
    <meta property="og:image" content="%VITE_FRONTEND_URL%/share-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_FRONTEND_URL%" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FOTLAB - Chemical Management System"
    />
    <meta
      name="twitter:description"
      content="Faculty of Technology Chemical Management System"
    />
    <meta
      name="twitter:image"
      content="%VITE_FRONTEND_URL%/share-image.png"
    />
  </head>

</html>
